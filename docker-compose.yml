services:
  backend:
    build: ./backend
    container_name: markdown-converter-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGINS: "http://localhost:8080"
      AWS_REGION: ${AWS_REGION:-us-east-1}
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: markdown-converter-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped